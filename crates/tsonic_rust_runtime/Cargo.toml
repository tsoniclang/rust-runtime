[package]
name = "tsonic_rust_runtime"
version = "0.1.0"
edition = "2021"

[features]
default = ["std"]
alloc = ["dep:num-bigint", "dep:num-traits"]
std = ["alloc", "num-bigint/std"]

[dependencies]
libm = "=0.2.16"
num-bigint = { version = "=0.4.8", default-features = false, optional = true }
num-traits = { version = "=0.2.19", default-features = false, optional = true }

[[test]]
name = "no_forbidden_shortcuts"
path = "../../tests/architecture/no_forbidden_shortcuts.rs"

[[test]]
name = "public_api_references"
path = "../../tests/architecture/public_api_references.rs"

[[test]]
name = "runtime_integration_tests"
path = "../../tests/runtime_integration_tests.rs"

[[test]]
name = "error_tests"
path = "../../tests/runtime/error_tests.rs"
required-features = ["alloc"]

[[test]]
name = "retained_error_tests"
path = "../../tests/runtime/retained_error_tests.rs"
required-features = ["alloc"]
